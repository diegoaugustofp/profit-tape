[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "profit-tape"
version = "0.1.0"
description = "Gravador de tape e book da B3 via ProfitDLL, com sink Parquet particionado."
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=15.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "structlog>=24.1",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.0",
]

[project.scripts]
profit-tape = "profittape.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/profittape"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer EXIGE typer.Option()/Argument() no default do parametro. B008 aqui e'
# falso positivo — nao ha default mutavel compartilhado.
"src/profittape/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
# ctypes com DLL externa nao tem stub; o modulo de bindings e' inerentemente dinamico.
[[tool.mypy.overrides]]
# ctypes com DLL externa nao tem stub; estes modulos sao inerentemente
# dinamicos por natureza -- callbacks cuja assinatura e' ditada pelo
# prototipo C da DLL (TNewTradeCallback etc.), nao pelo Python, e a
# interface de DLL injetavel (FakeProfitDLL em teste) e' estruturalmente
# tipada como Any de proposito. So' disallow_untyped_defs/calls sao
# relaxados aqui -- outras checagens estritas (ex.: union-attr, os
# generics de dict/list corrigidos em 2026-08-28) continuam ativas e ja
# pegaram bugs reais nestes mesmos modulos antes desta excecao.
module = [
    "profittape.profitdll.bindings",
    "profittape.profitdll.client",
    "profittape.ea.contas",
    "profittape.ea.service",
    "profittape.testing.fake_dll",
]
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["windows: exige Windows e a ProfitDLL real"]
