# Copie para config/alertas.yaml (gitignored — NUNCA versione o token real).
# Sem este arquivo, alertas ficam desligados e o record roda normalmente.
#
# Como criar o bot: fale com @BotFather no Telegram, /newbot, copie o token.
# Como achar o chat_id: fale com o bot, depois abra
