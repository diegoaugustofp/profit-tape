# Coletas de dado EM CURSO para hipoteses que ainda nao tem ficha (nao ha' EA nem operacao): so' o dado
# esta' sendo reunido, com prazo. Cada entrada carrega o `trecho` literal do plano de pesquisa; um teste
# (tests/test_coletas.py) falha se o texto de origem mudar. Lido pelo indice do diario (contagem
# regressiva) e pelo `profit-tape inventario-dados` (cruza com o que existe em disco).
#
# Fatos vindos de docs/RESEARCH_PLANO.md e docs/ESTADO_E_CAMINHOS.md; o que o operador afirmou em
# 03/10 (coletas WDO e opcoes seguem rodando) esta' marcado em `declarado_em`.

coletas:
  - id: rolagem_wdo
    titulo: "Rolagem do WDO pelo PAR CASADO entre contratos"
    hipotese: "A rolagem de contrato deixa marca no fluxo: o mesmo agente vende num contrato e compra no outro em ate' 2 s, mais do que o acaso."
    ativos: [WDOV26, WDOX26]
    # `trade` + `tiny_book` (topo do livro, chega para todo ticker assinado). O OFFER BOOK nao foi
    # assinado para estes contratos (inventario de 03/10: book_offer so' em 6 ativos).
    streams: [trade, tiny_book]
    desde: 2026-09-22
    marco: {data: 2026-10-01, rotulo: "virada WDOV26 -> WDOX26 (o WDO vence no 1o dia util do mes)"}
    fim: null
    estado: "Amostra FECHADA: o PAR existe em 7 pregoes (22 a 30/09). ENSAIO de 03/10 com o rolagem-par v4.28: razao 0,71 a 0,91 em 7 de 7 dias = defeito de FORMULA (nulo nao calibrado, unidade muitos-para-um, janela de 2 s saturada), nao resultado. Instrumentos de roll recuperados por backfill (WD1V26X26, DR1V26X26): pico em D-2 e D-1 (28 e 29/09). Pernas do roll so' em ate' 1% do volume no tape. Ver RESEARCH_PLANO, secao ROLAGEM: ensaio do WDO."
    proximo_passo: "Pergunta A implementada (v4.30): rolagem-persistencia --roll WD1V26X26 e' o ensaio de calibracao; o WDO rola todo mes (X26 -> Z26 em ~30/10: gravar ou fazer backfill de WD1X26Z26, WDOX26 e WDOZ26) e cada roll e' um evento da ficha (RESEARCH_PLANO, secao 7). Pergunta C so' abre pelo pool de >= 3 eventos."
    leitura_declarada: "Mudou em 03/10 (RESEARCH_PLANO, secao 6): vale o fluxo liquido por corretora contra nulo de INVERSAO DE SINAL (a permutacao entre corretoras foi descartada: destroi a correlacao de magnitude). O resultado do WDO e' depuracao e nao decide."
    limite: "Agente e' CORRETORA: um par pode ser dois clientes da mesma casa. Reduz o poder; o embaralhado sofre o mesmo."
    plano: "docs/RESEARCH_PLANO.md, secao 'ROLAGEM pelo PAR CASADO'"
    declarado_em: 2026-10-03
    trechos: ["`WDOV26` -> `WDOX26` e' nesta semana"]

  - id: rolagem_win
    titulo: "Rolagem do WIN pelo par casado (mesma hipotese, outro instrumento)"
    hipotese: "Idem rolagem_wdo, no WIN: WINV26 -> WINZ26."
    ativos: [WINV26, WINZ26]
    streams: [trade, tiny_book]
    desde: null
    marco: {data: 2026-10-14, rotulo: "vencimento do WIN (WINV26)"}
    fim: null
    estado: "Inventario de 03/10 (apos backfill do operador): WINV26 tem 21 dias (03/09 a 02/10, todos importados), WINZ26 desde 03/09 (6 a 23 mil negocios por dia); Os instrumentos de roll WI1V26Z26 (61 contratos em 7 dias) e IR1V26Z26 (so' 02/10) existem no GetHistoryTrades, mas ficam fora de `ativos` para nao entrar na conta do par do inventario. O backfill cobre 30 dias: o roll de D-2 a D (ate' 14/10) pode ser recuperado ate' ~13/11, sem gravar ao vivo."
    proximo_passo: "Depois de 14/10: backfill --por-dia de WINV26, WINZ26, WI1V26Z26 e IR1V26Z26 (--fim INCLUSIVO); curate; rolagem-persistencia --poder ANTES de olhar o resultado (portao de poder da ficha, RESEARCH_PLANO secao 7). Resultado de 1 roll e' descritivo."
    plano: "docs/ESTADO_E_CAMINHOS.md, secao 3.C ('Rolagem refeita')"
    trechos: ["assinar `WINV26` e `WINZ26` antes de ~07/10"]

  - id: opcoes_petr4_out
    titulo: "Opcoes de PETR4 de outubro: pinning no vencimento mensal"
    hipotese: "O hedge forcado do vendedor de opcao segura o preco perto do strike com OI relevante no vencimento (pinning)."
    ativos: [PETRJ49, PETRV49, PETRJ493, PETRJ494, PETRV494, PETRJ500, PETRV500, PETRJ22, PETRV22,
             PETRJ550, PETRV550, PETRJ470, PETRV470, PETRV480]
    streams: [trade, tiny_book]      # offer book nao assinado (inventario de 03/10)
    desde: 2026-09-22
    marco: {data: 2026-10-16, rotulo: "vencimento mensal de outubro (20 pregoes)"}
    fim: 2026-10-16
    estado: "14 series casando exatamente por OI (semanais excluidas), mes INTEIRO de 22/09 a 16/10. Spot de referencia PETR4 48,52 (fechamento de 18/09); maior strike por OI em 49,61 (15,4 M). Inventario de 03/10: as 14 series tem dado nos 9 pregoes esperados (22/09 a 02/10), mas as mais finas negociam 20 a 30 vezes por dia (PETRV550: 191 negocios em 9 pregoes; PETRJ470: 280), o que limita o poder do placebo."
    proximo_passo: "Depois do fechamento de 16/10 e do compact, rodar `profit-tape opcoes-vencimento` (a conta com strikes FALSOS, deslocados 1,7%, e' o placebo que decide)."
    leitura_declarada: "Declarada ANTES: em outubro o OI esta' colado no spot, entao um resultado NULO PESA CONTRA a hipotese (em setembro nao pesava)."
    limite: "O OI vem do Trade Hunter, e' EOD (nao intradiario) e e' posicao em aberto, nao fluxo. Se PETR4 andar mais de ~2% antes do inicio a lista de series se refaz."
    plano: "docs/RESEARCH_PLANO.md, secao 'Opcao sobre acao: series de OUTUBRO e a expectativa DECLARADA ANTES'"
    declarado_em: 2026-10-03
    trechos: ["Vencimento **16/10/2026**, 20 pregoes.", "Mes INTEIRO, de 22/09 a 16/10"]
